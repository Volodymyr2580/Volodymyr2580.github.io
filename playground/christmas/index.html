<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1a2d">
  <meta name="description" content="A little Christmas letter, written for you.">
  <title>Volodymyr's Christmas Gift · Playground</title>
  <link rel="icon" href="postmark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Dancing+Script:wght@600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css?v=20261123c">
  <script defer src="app.js?v=20261123c"></script>
</head>
<body>
  <main class="scene">
    <picture class="scene-art">
      <source media="(max-width: 720px) and (orientation: portrait)" srcset="art/post-office-portrait.webp">
      <img id="post-office" src="art/post-office-wide.webp" alt="" fetchpriority="high">
    </picture>
    <div id="lantern" class="lantern" aria-hidden="true"></div>
    <div id="waiting-letter" class="waiting-letter" aria-hidden="true"></div>
    <canvas id="snow" aria-hidden="true"></canvas>
    <div class="shade" aria-hidden="true"></div>

    <header class="topline">
      <a class="backlink" href="../"><span aria-hidden="true">‹</span> Playground</a>
      <div class="topline-meta">
        <button id="bgm-toggle" class="bgm-button" type="button" aria-pressed="false" aria-label="Play background music: Once Upon a Christmas Eve by Anson Seabra">
          <span class="bgm-icon" aria-hidden="true">♪</span>
          <span class="bgm-label">Music</span>
        </button>
        <time datetime="2026-12">December 2026</time>
      </div>
    </header>
    <audio id="bgm" src="audio/once-upon-a-christmas-eve.m4a" loop preload="metadata"></audio>

    <section class="hero" aria-labelledby="title">
      <p class="eyebrow christmas-wish">Merry Christmas~</p>
      <h1 id="title">Volodymyr's<br>Christmas Gift</h1>
      <p class="subtitle">A little Christmas letter, written for you.</p>
      <form id="pickup">
        <fieldset id="pickup-fields" disabled>
          <legend class="sr-only">Find your letter</legend>
          <div class="field">
            <label for="recipient">Your name</label>
            <input id="recipient" type="text" autocomplete="name" maxlength="80" required>
          </div>
          <div class="field">
            <label for="pickup-code">Your secret code</label>
            <input id="pickup-code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="80" required>
          </div>
          <button class="pickup-button" type="submit">Open my letter <span aria-hidden="true">→</span></button>
        </fieldset>
        <p id="pickup-status" class="notice" role="status"></p>
      </form>
      <noscript><p class="notice">Turn on JavaScript to pick up your letter.</p></noscript>
    </section>
  </main>

  <dialog id="mail" aria-labelledby="mail-title">
    <form method="dialog" class="close-form">
      <button class="close-button" type="submit" aria-label="Close letter">×</button>
    </form>
    <h2 id="mail-title" class="sr-only">Your Christmas letter</h2>
    <div id="sealed" class="sealed">
      <p class="delivery-note">Special delivery · December 2026</p>
      <button id="break-seal" class="envelope" type="button" aria-label="Break the wax seal and read your letter" autofocus>
        <span class="envelope-back" aria-hidden="true"></span>
        <span class="envelope-peek" aria-hidden="true">
          <span class="peek-line"></span>
          <span class="peek-line short"></span>
          <span class="peek-line"></span>
        </span>
        <span class="envelope-pocket" aria-hidden="true"></span>
        <span class="envelope-flap-wrap" aria-hidden="true">
          <span class="envelope-flap"></span>
        </span>
        <span id="envelope-recipient" class="envelope-recipient" aria-hidden="true"></span>
        <span class="wax" aria-hidden="true">
          <svg viewBox="0 0 120 120" width="84" height="84" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="wax-outer" cx="38%" cy="32%" r="68%">
                <stop offset="0%" stop-color="#cc523e"/>
                <stop offset="42%" stop-color="#96281e"/>
                <stop offset="82%" stop-color="#6b1812"/>
                <stop offset="100%" stop-color="#480d0a"/>
              </radialGradient>
              <radialGradient id="wax-well" cx="62%" cy="64%" r="65%">
                <stop offset="0%" stop-color="#a83326"/>
                <stop offset="55%" stop-color="#7c1e17"/>
                <stop offset="100%" stop-color="#4b0e0a"/>
              </radialGradient>
              <linearGradient id="wax-rim-light" x1="20" y1="18" x2="98" y2="100" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#f2a288" stop-opacity="0.72"/>
                <stop offset="35%" stop-color="#c95642" stop-opacity="0.18"/>
                <stop offset="72%" stop-color="#360906" stop-opacity="0.35"/>
                <stop offset="100%" stop-color="#290604" stop-opacity="0.65"/>
              </linearGradient>
              <linearGradient id="wax-emboss" x1="34" y1="34" x2="86" y2="86" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#f0a68b"/>
                <stop offset="52%" stop-color="#b94232"/>
                <stop offset="100%" stop-color="#6e1913"/>
              </linearGradient>
              <filter id="wax-drop" x="-16%" y="-14%" width="132%" height="136%">
                <feDropShadow dx="0" dy="5" stdDeviation="4.2" flood-color="#220907" flood-opacity="0.58"/>
              </filter>
            </defs>
            <!-- Organic hand-poured molten wax puddle -->
            <path filter="url(#wax-drop)" fill="url(#wax-outer)" d="M58 9 C71 7, 83 11, 93 19 C102 26, 111 38, 110 53 C112 66, 108 79, 98 90 C90 100, 77 109, 62 109 C48 111, 34 106, 24 96 C14 87, 8 73, 10 58 C8 44, 15 30, 25 21 C35 12, 46 10, 58 9 Z"/>
            <!-- Raised molten outer lip specular highlight -->
            <path fill="none" stroke="url(#wax-rim-light)" stroke-width="3.2" d="M58 13 C70 11, 81 15, 90 22 C98 29, 106 40, 105 53 C107 65, 103 77, 94 87 C86 96, 75 104, 61 104 C48 106, 36 101, 27 92 C18 84, 13 71, 15 58 C13 45, 19 33, 28 24 C37 16, 47 14, 58 13 Z"/>
            <!-- Glossy wax sheen on upper-left molten bulge -->
            <ellipse cx="38" cy="27" rx="13" ry="5.5" transform="rotate(-28 38 27)" fill="#f8bfa9" opacity="0.26"/>
            <!-- Pressed-in circular stamp bowl -->
            <circle cx="60" cy="60" r="34" fill="url(#wax-well)"/>
            <!-- Deep pressed rim shadow (top-left) & catchlight (bottom-right) -->
            <circle cx="60" cy="60" r="34" fill="none" stroke="#360906" stroke-width="2.6" stroke-dasharray="107 107" stroke-dashoffset="-14" opacity="0.72"/>
            <circle cx="60" cy="60" r="34" fill="none" stroke="#e48f74" stroke-width="1.8" stroke-dasharray="107 107" stroke-dashoffset="93" opacity="0.5"/>
            <!-- Inner embossed ring -->
            <circle cx="60" cy="60" r="28" fill="none" stroke="#3c0b08" stroke-width="1.3" opacity="0.55"/>
            <circle cx="59.4" cy="59.4" r="28" fill="none" stroke="#ea9c81" stroke-width="0.9" opacity="0.45"/>
            <!-- Sculpted 3D embossed snowflake (debossed shadow + raised highlight) -->
            <g transform="translate(1.2 1.6)" stroke="#380a07" stroke-width="2.8" stroke-linecap="round" opacity="0.68">
              <path d="M60 39 V81 M41.8 49.5 L78.2 70.5 M78.2 49.5 L41.8 70.5"/>
              <path d="M55 44 L60 49 L65 44 M55 76 L60 71 L65 76 M45 56 L51 54 L49 48 M75 64 L69 66 L71 72 M71 48 L69 54 L75 56 M49 72 L51 66 L45 64"/>
            </g>
            <g stroke="url(#wax-emboss)" stroke-width="2.5" stroke-linecap="round">
              <path d="M60 39 V81 M41.8 49.5 L78.2 70.5 M78.2 49.5 L41.8 70.5"/>
              <path d="M55 44 L60 49 L65 44 M55 76 L60 71 L65 76 M45 56 L51 54 L49 48 M75 64 L69 66 L71 72 M71 48 L69 54 L75 56 M49 72 L51 66 L45 64"/>
            </g>
            <circle cx="60" cy="60" r="3.6" fill="#d97b62" stroke="#470e0a" stroke-width="1"/>
          </svg>
        </span>
        <span class="seal-sparkle" aria-hidden="true"></span>
      </button>
      <p class="seal-hint">Tap the seal to open your letter</p>
    </div>
    <svg class="sr-only" aria-hidden="true">
      <defs>
        <filter id="parchment-edge" x="-6%" y="-6%" width="112%" height="112%">
          <feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="4" seed="7" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
    <div id="letter-wrap" class="letter-wrap" hidden>
      <div class="letter-parchment" aria-hidden="true"></div>
      <article id="letter" class="letter" aria-labelledby="letter-greeting">
      <div id="quill-pen" class="quill-pen" aria-hidden="true">
        <svg viewBox="0 0 72 72" width="66" height="66" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="quill-feather" x1="16" y1="54" x2="66" y2="6" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#c49a6c"/>
              <stop offset="35%" stop-color="#f7ead3"/>
              <stop offset="78%" stop-color="#fffaf0"/>
              <stop offset="100%" stop-color="#e8c89b"/>
            </linearGradient>
            <linearGradient id="quill-edge" x1="18" y1="56" x2="62" y2="8" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#843829"/>
              <stop offset="60%" stop-color="#c97d56"/>
              <stop offset="100%" stop-color="#e9c38d"/>
            </linearGradient>
          </defs>
          <!-- Feather vane -->
          <path d="M16 54 C18 36, 30 20, 48 11 C56 7, 64 5, 68 5 C65 13, 60 22, 53 29 L46 27 L50 32 C43 39, 34 45, 24 50 L29 44 L21 48 Z" fill="url(#quill-feather)" stroke="url(#quill-edge)" stroke-width="1.35" stroke-linejoin="round"/>
          <!-- Feather barb accents -->
          <path d="M28 42 C34 34, 43 24, 58 13" stroke="#b98a5b" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
          <path d="M36 27 L41 20 M44 21 L49 15 M26 39 L30 33" stroke="#c89b6c" stroke-width="0.9" stroke-linecap="round" opacity="0.5"/>
          <!-- Shaft (rachis) -->
          <path d="M65 8 C48 20, 30 36, 12 58" stroke="#6f3626" stroke-width="2.1" stroke-linecap="round"/>
          <!-- Gold collar -->
          <path d="M11 55 L17 61" stroke="#d49a47" stroke-width="3.2" stroke-linecap="round"/>
          <!-- Metallic nib -->
          <path d="M13 58 L2 69 L6 66 L15 60 Z" fill="#3b2723"/>
          <path d="M12 57 L2 69" stroke="#d8a256" stroke-width="0.9" stroke-linecap="round"/>
          <!-- Fresh ink drop at nib tip -->
          <circle cx="2.5" cy="68.5" r="1.5" fill="#3b2723"/>
        </svg>
      </div>
      <header class="letter-header">
        <p class="eyebrow">Volodymyr's Christmas Gift</p>
        <span class="letter-stamp"><img src="art/avatar-stamp.jpg" alt="" width="56" height="56"></span>
      </header>
      <h3 id="letter-greeting" tabindex="-1"></h3>
      <div id="letter-body"></div>
      <p id="letter-signature" class="signature">Warm wishes,<br><em>Wenzhe</em></p>
      <footer class="letter-footer">
        <p id="letter-date" class="letter-date">Christmas 2026</p>
        <div class="letter-controls">
          <button id="skip-writing" class="letter-action" type="button" hidden>Show all</button>
          <button id="replay-writing" class="letter-action" type="button" hidden>↺ Replay writing</button>
        </div>
      </footer>
      </article>
    </div>
  </dialog>
</body>
</html>
