<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Style Gallery</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f4f1;color:#172026;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Arial,sans-serif}
    main{width:1320px;margin:0 auto;padding:28px 0 40px}
    header{margin-bottom:22px;border-bottom:1px solid #d9ddd8;padding-bottom:16px}
    h1{margin:0;font-size:34px}
    p{margin:8px 0 0;color:#667}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
    figure{margin:0;background:#fff;border:1px solid #d8ddd8;border-radius:8px;overflow:hidden}
    img{display:block;width:100%;height:360px;object-fit:cover;object-position:top}
    figcaption{display:flex;justify-content:space-between;gap:16px;padding:12px 14px;font-weight:700}
    figcaption span{color:#69747c;font-weight:500}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Blogs + Research Log：10 种设计风格预览</h1>
      <p>每张缩略图都包含 Blogs 和 Research Log 两个区域，用来快速比较整体气质。</p>
    </header>
    <section class="grid">
      <figure><img src="./01-scholar-notes.png" alt="清冷学术札记风"><figcaption>01 清冷学术札记风<span>少卡片、细线、留白，像一个长期维护的学术笔记入口。</span></figcaption></figure><figure><img src="./02-japanese-diary.png" alt="日式个人博客风"><figcaption>02 日式个人博客风<span>更柔和，有生活感，适合公众号同步和轻量日记。</span></figcaption></figure><figure><img src="./03-fomalhaut-inspired.png" alt="Fomalhaut 参考站风"><figcaption>03 Fomalhaut 参考站风<span>保留个人博客门户、侧栏、文章流，但避免直接照搬。</span></figcaption></figure><figure><img src="./04-library-catalog.png" alt="复古图书馆目录风"><figcaption>04 复古图书馆目录风<span>像档案柜和馆藏目录，适合 topic 长期归档。</span></figcaption></figure><figure><img src="./05-typographic-minimal.png" alt="极简 Typographic 风"><figcaption>05 极简 Typographic 风<span>几乎不用装饰，靠编号、字体层级和秩序感成立。</span></figcaption></figure><figure><img src="./06-obsidian-wiki.png" alt="Obsidian 知识库风"><figcaption>06 Obsidian 知识库风<span>左侧 topic 树，右侧内容流，强调知识网络。</span></figcaption></figure><figure><img src="./07-lab-notebook.png" alt="实验室 Lab Notebook 风"><figcaption>07 实验室 Lab Notebook 风<span>强调目的、假设、设置、结果和下一步，适合实验归档。</span></figcaption></figure><figure><img src="./08-literary-magazine.png" alt="文学杂志 Essay 风"><figcaption>08 文学杂志 Essay 风<span>更像独立刊物，适合公开文章和公众号长文。</span></figcaption></figure><figure><img src="./09-latex-handout.png" alt="黑白数学讲义风"><figcaption>09 黑白数学讲义风<span>接近 LaTeX handout，适合数学推导、定义、remark。</span></figcaption></figure><figure><img src="./10-research-map.png" alt="个人研究地图风"><figcaption>10 个人研究地图风<span>首页像 topic map，把讲义、论文和实验挂到研究节点上。</span></figcaption></figure>
    </section>
  </main>
</body>
</html>
